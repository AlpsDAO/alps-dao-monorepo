name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily, so traits added on chain reach the site even without a code change
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: pages-deploy-${{ github.ref }}
  # A scheduled run waits for a deploy in progress rather than cancelling it
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Bring the bundled art up to date with the chain (new traits, their names and colours). If the chain
      # can't be read, the committed art is used; the site also tops itself up from the chain as it loads.
      - name: Sync traits from the chain
        id: traits
        continue-on-error: true
        run: |
          yarn workspace @nouns/assets sync-traits
          git diff --quiet -- packages/nouns-assets/src/image-data.json || echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          REACT_APP_MAINNET_JSONRPC: ${{ secrets.REACT_APP_MAINNET_JSONRPC }}

      - name: Rebuild the art package with the new traits
        if: steps.traits.outputs.changed == 'true'
        run: yarn workspace @nouns/assets build

      # The daily run only builds and deploys when the chain has art the committed file lacks
      - name: Build webapp
        if: github.event_name != 'schedule' || steps.traits.outputs.changed == 'true'
        run: yarn workspace @nouns/webapp build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
          REACT_APP_CHAIN_ID: '1'
          REACT_APP_ENABLE_HISTORY: 'true'
          REACT_APP_INFURA_PROJECT_ID: ${{ secrets.REACT_APP_INFURA_PROJECT_ID }}
          REACT_APP_MAINNET_JSONRPC: ${{ secrets.REACT_APP_MAINNET_JSONRPC }}
          REACT_APP_MAINNET_WSRPC: ${{ secrets.REACT_APP_MAINNET_WSRPC }}
          REACT_APP_THEGRAPH_STUDIO_API_KEY: ${{ secrets.REACT_APP_THEGRAPH_STUDIO_API_KEY }}
          REACT_APP_WALLET_CONNECT_V2_PROJECT_ID: ${{ secrets.REACT_APP_WALLET_CONNECT_V2_PROJECT_ID }}
          REACT_APP_ETHERSCAN_API_KEY: ${{ secrets.REACT_APP_ETHERSCAN_API_KEY }}

      # wrangler v4 requires Node 22; the CRA build above requires Node 20
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.traits.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.traits.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # yarn refuses to add wrangler to the workspace root (-W); use npm for the action's install
          packageManager: npm
          command: pages deploy packages/nouns-webapp/build --project-name=alps-wtf --branch=master
